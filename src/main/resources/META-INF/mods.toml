modLoader = "javafml"
loaderVersion = "[46,)"
license = "GPL-3.0"

[[mods]]
modId = "z_tweaks"
version = "${file.jarVersion}"
displayName = "TACZ: Z-Tweaks"
authors = "Z-Tweaks contributors"
description = '''
TACZ 附属：接管改装界面，以 GUI 形式提供更好的武器预览、更简单的改装流程与更易阅读的配件简介和参数。
'''

[[dependencies.z_tweaks]]
modId = "forge"
mandatory = true
versionRange = "[46,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.z_tweaks]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.z_tweaks]]
modId = "tacz"
mandatory = true
# 不限制版本：开发基于 1.1.8-hotfix，但 API 调用集中在公开包，硬卡下限只会挡住能跑的整合包。
# 空字符串 = 任意版本（Forge MavenVersionAdapter 对空 range 的约定）。
versionRange = ""
ordering = "AFTER"
side = "BOTH"
