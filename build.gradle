plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}"
group = "${mod_group}"
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = "${neo_version}"

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }

    mods {
        z_tweaks {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // TACZ NeoForge 1.21.1：官方映射，不需要 ForgeGradle 的 deobf。
    compileOnly files("libs/tacz-neoforge-${minecraft_version}-${tacz_version}.jar")
    runtimeOnly files("libs/tacz-neoforge-${minecraft_version}-${tacz_version}.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
